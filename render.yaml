# Render "Blueprint": the backend API as a Docker web service.
# Create it in Render with  New > Blueprint  and point it at this repository.
# The database lives at Neon (see DEPLOY.md); the frontend lives at Vercel.
services:
  - type: web
    name: medical-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: .
    plan: free                      # 512 MB RAM; sleeps after ~15 min idle (first request is slow). Use starter for always-on.
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL           # paste the Neon connection string (Render will not store it in git)
        sync: false
      - key: GEMINI_API_KEY         # your Google AI Studio key
        sync: false
      - key: CORS_ORIGINS           # your Vercel URL, e.g. https://medical-ai.vercel.app
        sync: false
      - key: JWT_SECRET             # generated for you: a long random value
        generateValue: true
      - key: GEMINI_MODELS          # tried in order; the next is used if one is overloaded or out of quota
        value: gemini-3.1-flash-lite,gemini-3.6-flash,gemini-2.5-flash
      - key: APP_ENV
        value: production
